spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: ai-rag-demo
  datasource:
    url: jdbc:h2:mem:ragdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:your-email@qq.com}
    password: ${MAIL_PASSWORD:your-smtp-password}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-key-here}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

rag:
  mq:
    exchange: rag.exchange
    queue: document.vectorize.queue
    routing-key: document.vectorize.routing
